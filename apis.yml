name: Capim
description: 'Capim is a Sao Paulo-based vertical SaaS and fintech company for the dental
  sector in Brazil, founded in 2021 by Marcelo Lutz and Roberto Biselli. Its platform
  pairs dental-clinic management software - appointment scheduling (Agenda Capim),
  digital patient records, and AI-driven patient reactivation - with embedded financial
  products: buy-now-pay-later patient financing (Financiamento Capim, up to 36 installments),
  direct-credit collections (Carne Capim), and an integrated card/PIX payment terminal
  (Maquininha Capim). Capim serves more than 6,000 dental clinics, has issued over R$450
  million in credit, and raised a US$26.7M Series A co-led by Valor Capital and QED Investors.
  No public developer API or documentation surface is currently published.'
